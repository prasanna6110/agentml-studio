[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentml-studio"
version = "1.0.0"
description = "Autonomous multi-agent AutoML + Agentic RAG framework powered by LLMs (GPT, Gemini, Llama)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prasanna Kumar Pandey" }]
keywords = ["agentic-ai", "generative-ai", "llm", "automl", "rag", "multi-agent", "deep-learning", "pytorch", "machine-learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "scipy>=1.10",
  "joblib>=1.3",
  "httpx>=0.25",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "pillow>=10",
]

[project.optional-dependencies]
deep = ["torch>=2.1"]
rag = ["sentence-transformers>=2.6"]
dev = ["pytest>=8", "ruff>=0.4"]
all = ["torch>=2.1", "pypdf>=4.0", "sentence-transformers>=2.6", "pytest>=8", "ruff>=0.4"]

[project.scripts]
agentml = "agentml.cli:main"

[tool.setuptools.packages.find]
include = ["agentml*"]

[tool.setuptools.package-data]
agentml = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "B008", "B905"]
